name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # Runs automatically every day at 3:00 AM UTC
  workflow_dispatch: # Allows you to trigger it manually once to start

permissions:
  contents: write # Allows the action to commit the generated images

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }} # Uses your PAT to read private repos

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&count_private=true
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }} # Uses your PAT to read private repos

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats" || exit 0
          git push
